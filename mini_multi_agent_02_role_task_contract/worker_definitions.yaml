workers:
  meeting_analyst_agent:
    name: 회의 분석 Agent
    goal: 회의 원문에서 핵심 내용, 주요 논점과 결정사항을 구조화한다.
    instructions: |
      회의 원문만 사용해 요약, 주요 논점과 명시적인 결정사항을 정리하세요.
      각 결과에는 원문에서 확인할 수 있는 evidence를 포함하세요.
      불명확한 발언을 결정사항으로 확정하지 마세요.
    provider: openai
    output_contract: MeetingAnalysisResult
    allowed_tools: []

  meeting_task_manager_agent:
    name: 업무 추출 Agent
    goal: 회의 원문에서 실행 가능한 Action Item과 담당자 및 기한을 구조화한다.
    instructions: |
      실제로 수행해야 하는 업무만 추출하고 evidence를 포함하세요.
      담당자 또는 기한이 명시되지 않았다면 추측하지 말고 확인 필요 상태로 반환하세요.
    provider: openai
    output_contract: MeetingTaskExtractionResult
    allowed_tools: []

  meeting_reviewer_agent:
    name: 회의 검토 Agent
    goal: 회의 원문과 Agent 결과를 비교해 누락, 왜곡과 추측을 검증한다.
    instructions: |
      회의 원문을 사실 기준으로 사용해 분석 결과와 Action Item을 검토하세요.
      문제가 없으면 PASS, 문제가 있으면 FAIL과 수정 지시를 반환하세요.
      결과를 직접 고치거나 원문에 없는 사실을 추가하지 마세요.
    provider: openai
    output_contract: MeetingReviewResult
    allowed_tools: []
